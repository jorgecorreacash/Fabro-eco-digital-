<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#13203E" />
      <stop offset="100%" stop-color="#0B1120" />
    </radialGradient>
    <linearGradient id="goldFrame" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="clover" x1="0" y1="-24" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldWord" x1="120" y1="220" x2="290" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#E5B842" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="34" y="34" width="444" height="444" rx="88" stroke="url(#goldFrame)" stroke-opacity="0.88" stroke-width="5" />

  <!-- Left 4-leaf clover -->
  <g transform="translate(96 256) scale(1.1)">
    <path d="M-1,-2 C-7,-20 -24,-18 -20,-4 C-24,-1 -17,8 -2,1 Z" fill="url(#clover)" />
    <path d="M1,-2 C7,-20 24,-18 20,-4 C24,-1 17,8 2,1 Z" fill="url(#clover)" />
    <path d="M-2,2 C-18,4 -21,20 -7,19 C-4,23 4,15 0,2 Z" fill="url(#clover)" />
    <path d="M2,2 C18,4 21,20 7,19 C4,23 -4,15 0,2 Z" fill="url(#clover)" />
    <path d="M0,4 C2,14 6,21 12,25" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="0" cy="0" r="2.8" fill="#FDE68A" />
  </g>

  <!-- Centered FABRO wordmark -->
  <text
    x="256"
    y="280"
    text-anchor="middle"
    font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif"
    font-size="74"
    font-weight="800"
    letter-spacing="4"
  >
    <tspan fill="url(#goldWord)">FAB</tspan><tspan fill="#F8FAFC">RO</tspan>
  </text>

  <!-- Right 4-leaf clover -->
  <g transform="translate(416 256) scale(1.1)">
    <path d="M-1,-2 C-7,-20 -24,-18 -20,-4 C-24,-1 -17,8 -2,1 Z" fill="url(#clover)" />
    <path d="M1,-2 C7,-20 24,-18 20,-4 C24,-1 17,8 2,1 Z" fill="url(#clover)" />
    <path d="M-2,2 C-18,4 -21,20 -7,19 C-4,23 4,15 0,2 Z" fill="url(#clover)" />
    <path d="M2,2 C18,4 21,20 7,19 C4,23 -4,15 0,2 Z" fill="url(#clover)" />
    <path d="M0,4 C-2,14 -6,21 -12,25" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="0" cy="0" r="2.8" fill="#FDE68A" />
  </g>
</svg>
