<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09131F" />
      <stop offset="55%" stop-color="#0E1B2B" />
      <stop offset="100%" stop-color="#0B2922" />
    </linearGradient>
    <linearGradient id="cloverGrad" x1="160" y1="82" x2="352" y2="274" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="wordGrad" x1="48" y1="290" x2="464" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="barGrad" x1="64" y1="412" x2="448" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="100" stroke="#10B981" stroke-opacity="0.28" stroke-width="3" />

  <!-- Four-leaf clover emblem -->
  <g transform="translate(256 172)">
    <circle cx="0" cy="0" r="88" fill="#10B981" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.3" stroke-width="3" />
    <path d="M-4,-6 C-20,-66 -70,-58 -60,-14 C-72,-6 -52,22 -6,2 Z" fill="url(#cloverGrad)" stroke="#ECFDF5" stroke-opacity="0.45" stroke-width="2" />
    <path d="M4,-6 C20,-66 70,-58 60,-14 C72,-6 52,22 6,2 Z" fill="url(#cloverGrad)" stroke="#ECFDF5" stroke-opacity="0.45" stroke-width="2" />
    <path d="M-6,5 C-56,12 -64,60 -22,58 C-12,70 12,46 -1,7 Z" fill="url(#cloverGrad)" stroke="#ECFDF5" stroke-opacity="0.45" stroke-width="2" />
    <path d="M6,5 C56,12 64,60 22,58 C12,70 -12,46 1,7 Z" fill="url(#cloverGrad)" stroke="#ECFDF5" stroke-opacity="0.45" stroke-width="2" />
    <path d="M1,14 C5,52 20,76 38,88" stroke="#10B981" stroke-width="10" stroke-linecap="round" fill="none" />
    <circle cx="0" cy="1" r="10" fill="#FDE68A" />
  </g>

  <!-- 3D Depth Shadow -->
  <text
    x="262"
    y="374"
    text-anchor="middle"
    fill="#08243E"
    font-family="Outfit, 'Segoe UI', system-ui, sans-serif"
    font-size="102"
    font-weight="800"
    letter-spacing="7"
  >
    FABRO
  </text>

  <!-- Main Wordmark -->
  <text
    x="256"
    y="366"
    text-anchor="middle"
    fill="url(#wordGrad)"
    stroke="#E0F2FE"
    stroke-opacity="0.4"
    stroke-width="1.5"
    font-family="Outfit, 'Segoe UI', system-ui, sans-serif"
    font-size="102"
    font-weight="800"
    letter-spacing="7"
  >
    FABRO
  </text>

  <rect x="76" y="398" width="360" height="10" rx="5" fill="url(#barGrad)" />
</svg>
