[build]
  command = "npm run build"
  publish = "dist"

# Allow cross-origin Firebase/Google OAuth popups without COOP severing window.closed/window.opener
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "unsafe-none"

# Never serve stale HTML, Service Worker, or PWA Manifest from CDN/browser cache
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache, must-revalidate"

# Reverse-proxy Firebase Auth helper routes on the same origin for redirect compatibility
[[redirects]]
  from = "/__/auth/*"
  to = "https://gen-lang-client-0243900704.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/init.json"
  to = "https://gen-lang-client-0243900704.firebaseapp.com/__/firebase/init.json"
  status = 200
  force = true

# SPA fallback for React routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
