    <script>
      // Capture Chrome/Edge/Android beforeinstallprompt early before React mounts
      window.__FABRO_DEFERRED_PROMPT__ = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__FABRO_DEFERRED_PROMPT__ = e;
        window.dispatchEvent(new Event('fabro-install-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__FABRO_DEFERRED_PROMPT__ = null;
        window.dispatchEvent(new Event('fabro-app-installed'));
      });
    </script>
  </head>
